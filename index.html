<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITOJ ILYA ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;

      background-image: url("images/sakura.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 240, 245, 0.35);
      pointer-events: none;
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:420px;
      padding:30px 22px;
      border-radius:30px;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.15);
      box-shadow:0 0 25px rgba(255,255,255,0.3),0 0 60px rgba(255,255,255,0.1);
      text-align:center;
      border:1px solid rgba(255,255,255,0.25);
    }

    .profile-img{
      width:130px;
      height:130px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,255,255,0.7);
      box-shadow:0 0 25px rgba(255,255,255,0.6);
      margin-bottom:18px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{ transform:translateY(0px); }
      50%{ transform:translateY(-8px); }
    }

    h1{
      color:#fff;
      font-size:28px;
      font-weight:600;
      margin-bottom:8px;
    }

    .jp{
      color:#fff;
      font-size:18px;
      margin-bottom:28px;
      letter-spacing:2px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .link-card{
      text-decoration:none;
      color:#5a4300;
      padding:18px 20px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:18px;
      background:rgba(255,255,255,0.35);
      transition:0.25s ease;
      box-shadow:0 0 25px rgba(255,182,217,0.8);
    }

    .link-card:hover{
      transform:scale(1.04);
    }

    .icon{
      width:54px;
      height:54px;
      border-radius:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      background:rgba(255,255,255,0.22);
    }

    .link-text h2{ font-size:18px; }
    .link-text p{ font-size:13px; opacity:0.8; }
  </style>
</head>

<body>

  <div class="container">

    <!-- PHOTO -->
    <img src="images/photo.jpg" class="profile-img">

    <h1>ITOJ ILYA ❤️</h1>

    <div class="jp">イトージュ・イリヤ ❤️</div>

    <div class="links">

      <a class="link-card" href="https://youtube.com/@cubecode2-o6s?si=o0pyEFyDP59Xppze" target="_blank">
        <div class="icon"><i class="fa-brands fa-youtube"></i></div>
        <div class="link-text">
          <h2>YouTube</h2>
          <p>@cubecode2-o6s</p>
        </div>
      </a>

      <a class="link-card" href="https://www.instagram.com/cubecode2?igsh=MTlxNjRhNGVkeTVpdQ==" target="_blank">
        <div class="icon"><i class="fa-brands fa-instagram"></i></div>
        <div class="link-text">
          <h2>Instagram</h2>
          <p>@cubecode2</p>
        </div>
      </a>

      <a class="link-card" href="https://x.com/Cubecode202" target="_blank">
        <div class="icon"><i class="fa-brands fa-x-twitter"></i></div>
        <div class="link-text">
          <h2>X</h2>
          <p>@Cubecode202</p>
        </div>
      </a>

      <a class="link-card" href="https://line.me/ti/p/qF_rjZ2gyg" target="_blank">
        <div class="icon"><i class="fa-brands fa-line"></i></div>
        <div class="link-text">
          <h2>LINE</h2>
          <p>Chat Link</p>
        </div>
      </a>

      <a class="link-card" href="https://open.spotify.com/user/31zutlonwkiep2pphmdrrfl6qvlq?si=PWrB8SNITpiESgqT5Y-SIQ" target="_blank">
        <div class="icon"><i class="fa-brands fa-spotify"></i></div>
        <div class="link-text">
          <h2>Spotify</h2>
          <p>Music Profile</p>
        </div>
      </a>

    </div>

  </div>

</body>
</html>
