    .container{

      box-shadow:0 0 25px rgba(255,255,255,0.6);
      margin-bottom:18px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{

      }

    h1{
      color:#ffffff;

    .links{

    .link-card{

      padding:18px 20px;

      display:flex;
      align-items:center;
      gap:18px;
      background:rgba(255,255,255,0.35);
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter:blur(10px);
      transition:0.25s ease;
      box-shadow:0 0 25px rgba(255,182,217,0.8);
    }

    .link-card:hover{
      transform:scale(1.04);
      background:rgba(255,255,255,0.28);
    }

    .icon{
      width:54px;
      height:54px;
      border-radius:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      background:rgba(255,255,255,0.22);
      box-shadow:0 0 15px rgba(255,255,255,0.2);
    }

    .link-text{
      text-align:left;
    }

    .link-text h2{
      font-size:18px;
      font-weight:600;
    }

    .link-text p{
      font-size:13px;
      opacity:0.8;
    }

    .sparkle{
      position:absolute;
      color:#5a4300;
      opacity:0.7;
      animation:spark 4s linear infinite;
      font-size:14px;
    }

    @keyframes spark{
      0%{
        transform:translateY(0px) rotate(0deg);
        opacity:0;
      }
      30%{
        opacity:1;
      }
      100%{
        transform:translateY(-120px) rotate(180deg);
        opacity:0;
      }
    }
      .sakura{
  position:absolute;
  font-size:28px;
  animation:fall linear infinite;
  opacity:0.8;
  filter:drop-shadow(0 0 8px #ff9ac9);
}

.s1{
  left:5%;
  top:-10%;
  animation-duration:10s;
}

.s2{
  left:25%;
  top:-20%;
  animation-duration:13s;
}

.s3{
  left:50%;
  top:-15%;
  animation-duration:9s;
}

.s4{
  left:75%;
  top:-25%;
  animation-duration:12s;
}

.s5{
  left:90%;
  top:-18%;
  animation-duration:11s;
}

@keyframes fall{
  0%{
    transform:
    translateY(-100px)
    rotate(0deg)
    translateX(0px);
  }

  50%{
    transform:
    translateY(50vh)
    rotate(180deg)
    translateX(30px);
  }

  100%{
    transform:
    translateY(120vh)
    rotate(360deg)
    translateX(-30px);
  }
}
