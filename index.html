  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow-y:auto;
background:url("Your-sakura.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
      position:relative;
    }

    @keyframes bgMove{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.08);
      }
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:420px;
      padding:30px 22px;
      border-radius:30px;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.15);
      box-shadow:
      0 0 25px rgba(255,255,255,0.3),
      0 0 60px rgba(255,255,255,0.1);
      text-align:center;
      border:1px solid rgba(255,255,255,0.25);
    }

    .profile-img{
      width:130px;
      height:130px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,255,255,0.7);
      box-shadow:0 0 25px rgba(255,255,255,0.6);
      margin-bottom:18px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    h1{
  font-size:32px;
  font-weight:900; 
  margin-bottom:8px;
  letter-spacing:2px;
  
  /* Sakura fill */
  background: url("Sakura-pattern.jpg");
  background-size: 20%; /* image thodi zoom hogi taaki flowers bade dikhen */
  background-position: center;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  
  /* Outline + Glow taaki text gayab na lage */
  -webkit-text-stroke: 1.5px #ffffff; /* white outline */
  filter: drop-shadow(0 0 15px rgba(255,255,255,0.8)) drop-shadow(0 0 25px rgba(255,183,197,1));
}

 .jp{
  font-size:22px;
  font-weight:800;
  margin-bottom:28px;
  letter-spacing:3px;
  display: block; /* ye important hai */
  
  background: url("Sakura-pattern.jpg");
  background-size: 800% auto;
  background-position: center;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  
  -webkit-text-stroke: 1.2px #ffffff;
  filter: drop-shadow(0 0 12px rgba(255,255,255,0.7)) drop-shadow(0 0 20px rgba(255,183,197,0.9));
  
  /* Ye 2 line glitch fix karti hain */
  transform: translateZ(0);
  will-change: transform;
}

    .links{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .link-card{
      text-decoration:none;
      color:#5a4300;
      padding:18px 20px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:18px;
      background:rgba(255,255,255,0.35);
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter:blur(10px);
      transition:0.25s ease;
      box-shadow:0 0 25px rgba(255,182,217,0.8);
    }

    .link-card:hover{
      transform:scale(1.04);
      background:rgba(255,255,255,0.28);
    }

    .icon{
      width:54px;
      height:54px;
      border-radius:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      background:rgba(255,255,255,0.22);
      box-shadow:0 0 15px rgba(255,255,255,0.2);
    }

    .link-text{
      text-align:left;
    }

    .link-text h2{
      font-size:18px;
      font-weight:600;
    }

    .link-text p{
      font-size:13px;
      opacity:0.8;
    }

    .sparkle{
      position:absolute;
      color:white;
      opacity:0.7;
      animation:spark 4s linear infinite;
      font-size:14px;
    }

    @keyframes spark{
      0%{
        transform:translateY(0px) rotate(0deg);
        opacity:0;
      }
      30%{
        opacity:1;
      }
      100%{
        transform:translateY(-120px) rotate(180deg);
        opacity:0;
      }
    }
   .sakura{
  position:absolute;
  font-size:28px;
  animation:fall linear infinite;
  opacity:0.8;
  filter:drop-shadow(0 0 8px #ff9ac9);
}

.s1{
  left:5%;
  top:-10%;
  animation-duration:10s;
}

.s2{
  left:25%;
  top:-20%;
  animation-duration:13s;
}

.s3{
  left:50%;
  top:-15%;
  animation-duration:9s;
}

.s4{
  left:75%;
  top:-25%;
  animation-duration:12s;
}

.s5{
  left:90%;
  top:-18%;
  animation-duration:11s;
}

@keyframes fall{
  0%{
    transform:
    translateY(-100px)
    rotate(0deg)
    translateX(0px);
  }

  50%{
    transform:
    translateY(50vh)
    rotate(180deg)
    translateX(30px);
  }

  100%{
    transform:
    translateY(120vh)
    rotate(360deg)
    translateX(-30px);
  }
}
.fa-youtube{
  color:#ff0000;
}

.fa-instagram{
  color:#e1306c;
}

.fa-x-twitter{
  color:#111111;
}

.fa-line{
  color:#06c755;
}

.fa-spotify{
  color:#1db954;
}
  </style>
