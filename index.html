<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITOJ ILYA ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/4ad53f8c4a.js" crossorigin="anonymous"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:
      linear-gradient(135deg,#f8e7a7,#fff4c9,#f6e08a);
      position:relative;
    }

    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left, rgba(255,255,255,0.6), transparent 40%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.4), transparent 40%);
      animation:bgMove 8s infinite alternate ease-in-out;
    }

    @keyframes bgMove{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.08);
      }
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:420px;
      padding:30px 22px;
      border-radius:30px;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.15);
      box-shadow:
      0 0 25px rgba(255,255,255,0.3),
      0 0 60px rgba(255,255,255,0.1);
      text-align:center;
      border:1px solid rgba(255,255,255,0.25);
    }

    .profile-img{
      width:130px;
      height:130px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid rgba(255,255,255,0.7);
      box-shadow:0 0 25px rgba(255,255,255,0.6);
      margin-bottom:18px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    h1{
      color:#ffffff;
      font-size:28px;
      font-weight:600;
      text-shadow:0 0 10px rgba(255,255,255,0.5);
      margin-bottom:8px;
    }

    .jp{
      color:#fff;
      font-size:18px;
      margin-bottom:28px;
      letter-spacing:2px;
      text-shadow:0 0 10px rgba(255,255,255,0.5);
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .link-card{
      text-decoration:none;
      color:white;
      padding:18px 20px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:18px;
      background:rgba(255,255,255,0.18);
      border:1px solid rgba(255,255,255,0.25);
      backdrop-filter:blur(10px);
      transition:0.25s ease;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
    }

    .link-card:hover{
      transform:scale(1.04);
      background:rgba(255,255,255,0.28);
    }

    .icon{
      width:54px;
      height:54px;
      border-radius:16px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:26px;
      background:rgba(255,255,255,0.22);
      box-shadow:0 0 15px rgba(255,255,255,0.2);
    }

    .link-text{
      text-align:left;
    }

    .link-text h2{
      font-size:18px;
      font-weight:600;
    }

    .link-text p{
      font-size:13px;
      opacity:0.8;
    }

    .sparkle{
      position:absolute;
      color:white;
      opacity:0.7;
      animation:spark 4s linear infinite;
      font-size:14px;
    }

    @keyframes spark{
      0%{
        transform:translateY(0px) rotate(0deg);
        opacity:0;
      }
      30%{
        opacity:1;
      }
      100%{
        transform:translateY(-120px) rotate(180deg);
        opacity:0;
      }
    }
  </style>
</head>

<body>

  <div class="sparkle" style="left:70%; bottom:-30px; animation-delay:3s;">♡</div>
  <div class="sparkle" style="left:90%; bottom:-15px; animation-delay:1.5s;">✦</div>
